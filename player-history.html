<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Male FF | Player & Trade History</title><style>
:root{color-scheme:dark}body{font:15px/1.5 system-ui;background:#080d19;color:#f5f7fb;margin:0}header,main{max-width:1100px;margin:auto;padding:24px}a{color:#f4bf56}.muted{color:#a8bad0}h1{font-size:clamp(27px,5vw,45px)}h2{color:#f4bf56}section{background:#121e30;padding:18px;margin:22px 0;border:1px solid #30435a;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #30435a}th{font-size:12px;color:#a8bad0}section>div{overflow-x:auto}button{background:#293950;color:white;padding:9px 12px;border:1px solid #4d6178;border-radius:7px;cursor:pointer}button.active{color:#f4bf56}nav{display:flex;flex-wrap:wrap;gap:10px}.notice{border-left:3px solid #f4bf56;padding-left:14px}
</style></head><body><header><a href="/">← Alpha Male FF</a><h1>Player & Trade History</h1><p class="muted">Sleeper seasons 2024–2026 · weekly team rosters, trade partners and most-traded players</p><p class="notice" id="status">Loading weekly rosters and transactions…</p><nav><button class="active" data-tab="all">Overview</button><button data-tab="players">Player loyalty</button><button data-tab="trades">Trades</button></nav></header><main id="main"></main><script>
const leagues={2024:'1137184732384940032',2025:'1257118106497593344',2026:'1386887172610600960'};
const people={'G-wizz':'Mike',jlong11:'Justin',ryan14cook:'Ryan',ajgardner307:'Andrew',zbautista:'Zach',zbautista13:'Zach',sbautista:'Seth',KEEESHH:'Marcus',iamSeanWard:'Sean',Ko21:'Kody',jgargano:'Joey',KeiganW:'Keigan',jbitner24:'Jacob'};
const api='https://api.sleeper.app/v1';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabular=(heads,rows)=>'<div><table><thead><tr>'+heads.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
const rosterWeeks=new Map(),playerManagers=new Map(),trades=[],failed=[];
let playerNames={},tab='all';
function name(id){const p=playerNames[id];return p?(p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')):String(id)}
async function season(y,id,currentWeek){
 const [users,rosters]=await Promise.all([get(api+'/league/'+id+'/users'),get(api+'/league/'+id+'/rosters')]);
 const byUser=new Map(users.map(x=>[String(x.user_id),x]));
 const rosterName=new Map(rosters.map(r=>{const u=byUser.get(String(r.owner_id))||{};const raw=u.display_name||u.username||'';return [Number(r.roster_id),people[raw]||people[u.username]||raw]}));
 const rounds=y===2026?Math.max(0,Math.min(18,currentWeek-1)):17;
 const weeks=await Promise.all(Array.from({length:rounds},(_,i)=>i+1).map(async w=>{
 try{return {week:w,matchups:await get(api+'/league/'+id+'/matchups/'+w),tx:await get(api+'/league/'+id+'/transactions/'+w)}}
 catch(e){failed.push(y+' Week '+w+' ('+e.message+')');return null}
 }));
 const seen=new Set();
 for(const data of weeks.filter(Boolean)){
 for(const r of data.matchups){const manager=rosterName.get(Number(r.roster_id));if(!manager)continue;
 for(const id of new Set(r.players||[])){const mkey=y+'|'+data.week+'|'+manager+'|'+id;if(rosterWeeks.has(mkey))continue;rosterWeeks.set(mkey,{manager,player:id,year:y,week:data.week});const pm=playerManagers.get(id)||new Map();const one=pm.get(manager)||new Set();one.add(y);pm.set(manager,one);playerManagers.set(id,pm)}}
 for(const x of data.tx){if(x.type!=='trade'||x.status!=='complete'||seen.has(String(x.transaction_id)))continue;seen.add(String(x.transaction_id));const parties=[...new Set((x.roster_ids||[]).map(id=>rosterName.get(Number(id))).filter(Boolean))];const ids=[...new Set([...Object.keys(x.adds||{}),...Object.keys(x.drops||{})])];trades.push({year:y,week:data.week,parties,players:ids,id:x.transaction_id})}
 }
}
function render(){
 const rows=[...rosterWeeks.values()],playerMap=new Map();
 for(const r of rows){const p=playerMap.get(r.player)||{id:r.player,weeks:0,managers:new Set()};p.weeks++;p.managers.add(r.manager);playerMap.set(r.player,p)}
 const ranked=[...playerMap.values()].sort((a,b)=>b.weeks-a.weeks);
 const loyalty=[...playerManagers].flatMap(([id,managers])=>[...managers].map(([manager,years])=>({id,manager,weeks:rows.filter(r=>r.player===id&&r.manager===manager).length,years:years.size}))).sort((a,b)=>b.weeks-a.weeks);
 const traded=new Map();for(const t of trades)for(const id of t.players)traded.set(id,(traded.get(id)||0)+1);
 const topTrades=[...traded].sort((a,b)=>b[1]-a[1]);
 const pairs=new Map();for(const t of trades)for(let i=0;i<t.parties.length;i++)for(let j=i+1;j<t.parties.length;j++){const k=[t.parties[i],t.parties[j]].sort().join(' | ');pairs.set(k,(pairs.get(k)||0)+1)}
 const topPairs=[...pairs].sort((a,b)=>b[1]-a[1]);
 const overview='<section><h2>At a glance</h2><p>'+rows.length.toLocaleString()+' player-team-week appearances · '+playerMap.size+' unique player IDs · '+trades.length+' completed trades</p><p class="muted">A player-week counts a player listed on a team\'s full roster, including bench, once per week. A traded player counts once per completed transaction when identifiable in the transaction adds/drops. Draft-pick-only trades count toward trade partnerships but have no player to credit.</p></section>';
 const players='<section><h2>Who stayed on teams the most?</h2>'+tabular(['Player','Rostered weeks','Managers'],ranked.slice(0,35).map(x=>[name(x.id),x.weeks,x.managers.size]))+'</section><section><h2>Manager × player loyalty</h2>'+tabular(['Manager','Player','Rostered weeks','Seasons'],loyalty.slice(0,70).map(x=>[x.manager,name(x.id),x.weeks,x.years]))+'</section>';
 const history='<section><h2>Most traded players</h2>'+tabular(['Player','Completed trades'],topTrades.slice(0,45).map(x=>[name(x[0]),x[1]]))+'</section><section><h2>Most frequent trade partners</h2>'+tabular(['Managers','Trades'],topPairs.map(x=>[x[0],x[1]]))+'</section><section><h2>Trade ledger</h2>'+tabular(['Season','Week','Managers','Players'],trades.sort((a,b)=>b.year-a.year||b.week-a.week).map(t=>[t.year,t.week,t.parties.join(' ↔ '),t.players.map(name).join(', ')||'Draft picks / FAAB']))+'</section>';
 document.querySelector('#main').innerHTML=overview+(tab==='all'||tab==='players'?players:'')+(tab==='all'||tab==='trades'?history:'');
}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));render()});
(async()=>{try{
 const state=await get(api+'/state/nfl');const w=state.season==='2026'?Number(state.week||1):1;
 await Promise.all(Object.entries(leagues).map(async([y,id])=>{try{await season(Number(y),id,w)}catch(e){failed.push(y+': '+e.message)}}));
 render();document.querySelector('#status').textContent='Loaded 2024–2026 Sleeper records. '+(failed.length?failed.length+' weekly/API requests failed; figures are partial.':'All requested weekly endpoints responded.');
 try{const names=await get(api+'/players/nfl');playerNames=names;render()}catch(e){document.querySelector('#status').textContent+=' Player names unavailable; showing IDs.'}
 }catch(e){document.querySelector('#status').textContent='Could not load Sleeper data: '+e.message}})();
</script></body></html>
