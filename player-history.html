<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMFL | Players & Trades</title><link rel="icon" type="image/svg+xml" href="/assets/amfl-shield.svg"><style>
:root{color-scheme:dark}body{font:15px/1.5 system-ui;background:#061225;color:#f3f5fa;margin:0}header,main{max-width:1100px;margin:auto;padding:24px}a{color:#e3b657}.muted{color:#a8bad0}h1{font-size:clamp(27px,5vw,45px)}h2{color:#e3b657}section{background:#0b1d35;padding:18px;margin:22px 0;border:1px solid #294266;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #294266}th{font-size:12px;color:#a8bad0}section>div{overflow-x:auto}button{background:#293950;color:white;padding:9px 12px;border:1px solid #4d6178;border-radius:7px;cursor:pointer}button.active{color:#e3b657}nav{display:flex;flex-wrap:wrap;gap:10px}.notice{border-left:3px solid #e3b657;padding-left:14px}
</style><style>
 /* AMFL red-white-blue companion-page theme */
 body{background:#06142b!important;color:#f7f9fd!important}
 header{border-bottom-color:#c82735!important}
 section{background:#0c2244!important;border-color:#344e76!important}

 nav{background:#102b57!important;border-bottom:2px solid #c82735!important}

:root{--gold:#dcb458;--blue:#2664bd;--red:#c82735;--text:#f6f8fd}

</style></head><body><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><a href="/" aria-label="AMFL Home"><img src="/assets/amfl-shield.png" onerror="this.onerror=null;this.src='/assets/amfl-shield.svg'" alt="AMFL" style="width:54px;height:54px;object-fit:contain"></a><strong style="font-size:20px;letter-spacing:2px;color:#e3b657">AMFL</strong></div><header><a href="/">← Alpha Male FF</a><h1>Player & Trade History</h1><p class="muted">Sleeper seasons 2024–2026 · weekly team rosters, trade partners and most-traded players</p><p class="notice" id="status">Loading weekly rosters and transactions…</p><nav><button class="active" data-tab="all">Overview</button><button data-tab="players">Player loyalty</button><button data-tab="trades">Trades</button></nav></header><main id="main"></main><script>
const leagues={2024:'1137184732384940032',2025:'1257118106497593344',2026:'1386887172610600960'};
const people={'G-wizz':'Mike',jlong11:'Justin',ryan14cook:'Ryan',ajgardner307:'Andrew',zbautista:'Zach',zbautista13:'Zach',sbautista:'Seth',KEEESHH:'Marcus',iamSeanWard:'Sean',Ko21:'Kody',jgargano:'Joey',KeiganW:'Keigan',jbitner24:'Jacob'};
const api='https://api.sleeper.app/v1';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabular=(heads,rows)=>'<div><table><thead><tr>'+heads.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
const rosterWeeks=new Map(),playerManagers=new Map(),trades=[],draftPicks=[],failed=[],playerScores=new Map(),playerMoves=[];
let playerNames={},tab='all';
function name(id){const p=playerNames[id];return p?(p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')):String(id)}
async function season(y,id,currentWeek){
 const [users,rosters,drafts]=await Promise.all([get(api+'/league/'+id+'/users'),get(api+'/league/'+id+'/rosters'),get(api+'/league/'+id+'/drafts').catch(()=>[])]);
 const byUser=new Map(users.map(x=>[String(x.user_id),x]));
 const rosterName=new Map(rosters.map(r=>{const u=byUser.get(String(r.owner_id))||{};const raw=u.display_name||u.username||'';return [Number(r.roster_id),people[raw]||people[u.username]||raw]}));
 const rounds=y===2026?Math.max(0,Math.min(18,currentWeek-1)):17;
 const weeks=await Promise.all(Array.from({length:rounds},(_,i)=>i+1).map(async w=>{
 try{return {week:w,matchups:await get(api+'/league/'+id+'/matchups/'+w),tx:await get(api+'/league/'+id+'/transactions/'+w)}}
 catch(e){failed.push(y+' Week '+w+' ('+e.message+')');return null}
 }));
 for(const draft of drafts){if(!draft.draft_id)continue;const picks=await get(api+'/draft/'+draft.draft_id+'/picks').catch(()=>[]);for(const pick of picks){const manager=rosterName.get(Number(pick.roster_id));if(manager&&pick.player_id)Number(pick.round)===1&&draftPicks.push({year:y,manager,player:pick.player_id})}}
 const seen=new Set();
 for(const data of weeks.filter(Boolean)){
 for(const r of data.matchups){for(const [id,pts] of Object.entries(r.players_points||{})){const k=y+'|'+data.week+'|'+id;if(!playerScores.has(k))playerScores.set(k,Number(pts)||0)}const manager=rosterName.get(Number(r.roster_id));if(!manager)continue;
 for(const id of new Set(r.players||[])){const mkey=y+'|'+data.week+'|'+manager+'|'+id;if(rosterWeeks.has(mkey))continue;rosterWeeks.set(mkey,{manager,player:id,year:y,week:data.week});const pm=playerManagers.get(id)||new Map();const one=pm.get(manager)||new Set();one.add(y);pm.set(manager,one);playerManagers.set(id,pm)}}
 for(const x of data.tx){if(x.status!=='complete'||seen.has(String(x.transaction_id)))continue;seen.add(String(x.transaction_id));if(x.type==='waiver'||x.type==='free_agent'){for(const [player,rosterId] of Object.entries(x.adds||{})){const manager=rosterName.get(Number(rosterId));if(manager)playerMoves.push({year:y,week:data.week,manager,player,kind:'add',via:x.type})}for(const [player,rosterId] of Object.entries(x.drops||{})){const manager=rosterName.get(Number(rosterId));if(manager)playerMoves.push({year:y,week:data.week,manager,player,kind:'drop',via:x.type})}}if(x.type!=='trade')continue;const parties=[...new Set((x.roster_ids||[]).map(id=>rosterName.get(Number(id))).filter(Boolean))];const ids=[...new Set([...Object.keys(x.adds||{}),...Object.keys(x.drops||{})])];trades.push({year:y,week:data.week,parties,players:ids,id:x.transaction_id})}
 }
}
function render(){
 const rows=[...rosterWeeks.values()],playerMap=new Map();
 for(const r of rows){const p=playerMap.get(r.player)||{id:r.player,weeks:0,managers:new Set()};p.weeks++;p.managers.add(r.manager);playerMap.set(r.player,p)}
 const ranked=[...playerMap.values()].sort((a,b)=>b.weeks-a.weeks);
 const loyalty=[...playerManagers].flatMap(([id,managers])=>[...managers].map(([manager,years])=>({id,manager,weeks:rows.filter(r=>r.player===id&&r.manager===manager).length,years:years.size}))).sort((a,b)=>b.weeks-a.weeks);
 const traded=new Map();for(const t of trades)for(const id of t.players)traded.set(id,(traded.get(id)||0)+1);
 const topTrades=[...traded].sort((a,b)=>b[1]-a[1]);
 const pairs=new Map();for(const t of trades)for(let i=0;i<t.parties.length;i++)for(let j=i+1;j<t.parties.length;j++){const k=[t.parties[i],t.parties[j]].sort().join(' | ');pairs.set(k,(pairs.get(k)||0)+1)}
 const topPairs=[...pairs].sort((a,b)=>b[1]-a[1]);
 const draftCounts=new Map(),draftCombos=new Map();
 for(const x of draftPicks){draftCounts.set(x.player,(draftCounts.get(x.player)||0)+1);const k=x.manager+'|'+x.player;draftCombos.set(k,(draftCombos.get(k)||0)+1)}
 const topDrafts=[...draftCounts].sort((a,b)=>b[1]-a[1]);
 const topDraftCombos=[...draftCombos].sort((a,b)=>b[1]-a[1]);
 const drafted='<section><h2>Most first-round draft picks · 2024–2026</h2>'+tabular(['Player','Draft selections'],topDrafts.slice(0,45).map(x=>[name(x[0]),x[1]]))+'</section><section><h2>Repeat first-round picks by manager</h2>'+tabular(['Manager','Player','Times drafted'],topDraftCombos.slice(0,35).map(x=>[x[0].split('|')[0],name(x[0].split('|')[1]),x[1]]))+'</section>';
 const overview='<section><h2>At a glance</h2><p>'+rows.length.toLocaleString()+' player-team-week appearances · '+playerMap.size+' unique player IDs · '+trades.length+' completed trades</p><p class="muted">A player-week counts a player listed on a team\'s full roster, including bench, once per week. A traded player counts once per completed transaction when identifiable in the transaction adds/drops. Draft-pick-only trades count toward trade partnerships but have no player to credit.</p></section>';
 const players='<section><h2>Who stayed on teams the most?</h2>'+tabular(['Player','Rostered weeks','Managers'],ranked.slice(0,35).map(x=>[name(x.id),x.weeks,x.managers.size]))+'</section><section><h2>Manager × player loyalty</h2>'+tabular(['Manager','Player','Rostered weeks','Seasons'],loyalty.slice(0,70).map(x=>[x.manager,name(x.id),x.weeks,x.years]))+'</section>';
 const dropped=new Map(),pickup=new Map(),streams=new Map(),streamedPlayers=new Map();
 const addMoves=playerMoves.filter(x=>x.kind==='add'),dropMoves=playerMoves.filter(x=>x.kind==='drop');
 for(const x of dropMoves)dropped.set(x.player,(dropped.get(x.player)||0)+1);
 const futurePoints=x=>{let total=0,scored=0;for(let w=x.week+1;w<=17;w++){const p=playerScores.get(x.year+'|'+w+'|'+x.player);if(p!==undefined){total+=p;scored++}}return scored?Math.round(total*100)/100:null};
 const goodPickups=addMoves.filter(x=>x.via==='waiver').map(x=>({...x,future:futurePoints(x)})).filter(x=>x.future!==null).sort((a,b)=>b.future-a.future);
 const dropEvents=new Map();for(const x of dropMoves){const k=[x.year,x.manager,x.player,x.week].join('|');if(!dropEvents.has(k))dropEvents.set(k,x)}const badDrops=[...dropEvents.values()].map(x=>({...x,future:futurePoints(x)})).filter(x=>x.future!==null).sort((a,b)=>b.future-a.future);
 const dropsByManager=new Map(dropMoves.map(x=>[x.year+'|'+x.manager+'|'+x.player+'|'+x.week,x]));
 for(const x of addMoves){if(dropsByManager.has(x.year+'|'+x.manager+'|'+x.player+'|'+(x.week+1))){streams.set(x.manager,(streams.get(x.manager)||0)+1);streamedPlayers.set(x.player,(streamedPlayers.get(x.player)||0)+1)}}
 const droppedRank=[...dropped].sort((a,b)=>b[1]-a[1]);
 const streamRank=[...streams].sort((a,b)=>b[1]-a[1]);
 const streamPlayersRank=[...streamedPlayers].sort((a,b)=>b[1]-a[1]);
 const waivers='<section><h2>Most dropped players</h2>'+tabular(['Player','Drops'],droppedRank.slice(0,40).map(x=>[name(x[0]),x[1]]))+'</section>'+
 '<section><h2>Most streamed by manager</h2><p class="muted">Stream = a completed waiver/free-agent add followed by a drop by the same manager in the following league week. Week-specific transaction records must be available.</p>'+tabular(['Manager','Streams'],streamRank.map(x=>[x[0],x[1]]))+'</section>'+
 '<section><h2>Most streamed players</h2>'+tabular(['Player','One-week streams'],streamPlayersRank.slice(0,45).map(x=>[name(x[0]),x[1]]))+'</section>'+
 '<section><h2>Best waiver pickups · remaining-season points</h2><p class="muted">Estimated using all available player points in subsequent weeks of the same season, regardless of which manager rostered the player later. This is not value over replacement.</p>'+tabular(['Year','Week','Manager','Player','Subsequent points'],goodPickups.slice(0,45).map(x=>[x.year,x.week,x.manager,name(x.player),x.future]))+'</section>'+
 '<section><h2>Worst Drops · remaining-season points</h2><p class="muted">Subsequent points scored by the player anywhere in the league after the drop. Rankings are descriptive and can include players reacquired later.</p>'+tabular(['Year','Week','Manager','Player','Subsequent points'],badDrops.filter((x,i,all)=>all.findIndex(y=>y.year===x.year&&y.player===x.player)===i).slice(0,45).map(x=>[x.year,x.week,x.manager,name(x.player),x.future]))+'</section>';
 const history='<section><h2>Most traded players</h2>'+tabular(['Player','Completed trades'],topTrades.slice(0,45).map(x=>[name(x[0]),x[1]]))+'</section><section><h2>Most frequent trade partners</h2>'+tabular(['Managers','Trades'],topPairs.map(x=>[x[0],x[1]]))+'</section><section><h2>Trade ledger</h2>'+tabular(['Season','Week','Managers','Players'],trades.sort((a,b)=>b.year-a.year||b.week-a.week).map(t=>[t.year,t.week,t.parties.join(' ↔ '),t.players.map(name).join(', ')||'Draft picks / FAAB']))+'</section>';
 document.querySelector('#main').innerHTML=overview+(tab==='all'||tab==='players'?players+drafted:'')+(tab==='all'||tab==='trades'?history+waivers:'');
}
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));render()});
(async()=>{try{
 let state={};try{state=await get(api+'/state/nfl')}catch(e){try{const snapshot=await get('./data-2026.json');state={season:'2026',week:Math.max(1,...(snapshot.completed_weeks||[]).map(x=>Number(x.week)+1))}}catch(ignore){state={season:'2026',week:1}}}const w=String(state.season)==='2026'?Number(state.week||1):1;
 await Promise.all(Object.entries(leagues).map(async([y,id])=>{try{await season(Number(y),id,w)}catch(e){failed.push(y+': '+e.message)}}));
 render();document.querySelector('#status').textContent='Loaded 2024–2026 Sleeper records. '+(failed.length?failed.length+' weekly/API requests failed; figures are partial.':'All requested weekly endpoints responded.');
 try{const names=await get(api+'/players/nfl');playerNames=names;render()}catch(e){document.querySelector('#status').textContent+=' Player names unavailable; showing IDs.'}
 }catch(e){document.querySelector('#status').textContent='Could not load Sleeper data: '+e.message}})();
</script></body></html>
