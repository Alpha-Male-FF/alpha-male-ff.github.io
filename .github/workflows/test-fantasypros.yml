name: Test FantasyPros API connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate API key and read-only rankings endpoint
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/test_fantasypros_connection.py
