name: Refresh Sleeper 2026 standings

on:
  schedule:
    # Runs every Tuesday at 15:17 UTC (after Monday Night Football stats settle)
    - cron: '17 15 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Sleeper sync
        env:
          SLEEPER_2026_LEAGUE_ID: '1386887172610600960'
        run: |
          python scripts/sync_sleeper_2026.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-2026.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update 2026 Sleeper data [skip ci]" && git push)
