name: Refresh FantasyPros research snapshot

on:
  workflow_dispatch:
    inputs:
      nfl_week:
        description: 'Upcoming NFL week (1-18)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Two independent controls: secret API key and explicitly approved public publication.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh approved public player snapshot
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          FANTASYPROS_PUBLICATION_APPROVED: ${{ vars.FANTASYPROS_PUBLICATION_APPROVED }}
          FP_NFL_SEASON: '2026'
          FP_NFL_WEEK: ${{ inputs.nfl_week }}
        run: python scripts/sync_fantasypros.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fantasypros-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh authorized FantasyPros player research [skip ci]"
            git push
          fi
